name: Blinkit Hourly 80%+ Deal Hunter

on:
  schedule:
    # Runs every hour at minute 31 UTC (= minute 01 of every hour IST)
    - cron: '31 * * * *'
  workflow_dispatch:
    inputs:
      min_discount:
        description: 'Minimum discount percentage (default: 80)'
        required: false
        default: '80'
      runner_type:
        description: 'Runner target: self-hosted (Home PC) or ubuntu-latest (GitHub cloud)'
        type: choice
        options:
          - self-hosted
          - ubuntu-latest
        default: self-hosted
      force_send:
        description: 'Force send all matching deals (skip deduplication)'
        type: boolean
        required: false
        default: false
      dry_run:
        description: 'Dry run only (scrape and verify without sending Telegram alerts)'
        type: boolean
        required: false
        default: false

jobs:
  hunt:
    name: Blinkit Deal Hunter
    runs-on: ${{ inputs.runner_type || 'self-hosted' }}
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          clean: false

      # Only needed on cloud-hosted runners; self-hosted PC already has Node installed
      - name: Setup Node.js 20 (Cloud only)
        if: runner.os == 'Linux'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Re-use existing node_modules on self-hosted runner to avoid downloading packages every hour
      - name: Install Dependencies (Windows)
        if: runner.os == 'Windows'
        working-directory: blinkit-bot
        run: |
          if (-not (Test-Path node_modules)) {
            echo "Installing dependencies..."
            npm install --production
          } else {
            echo "Dependencies already present in workspace. Skipping install."
          }

      - name: Install Dependencies (Linux)
        if: runner.os == 'Linux'
        working-directory: blinkit-bot
        run: |
          if [ ! -d "node_modules" ]; then
            npm install --production
          else
            echo "Dependencies already present in workspace. Skipping install."
          fi

      - name: Install Xvfb (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Restore Deal Cache (Cloud only)
        if: runner.os == 'Linux'
        uses: actions/cache/restore@v4
        with:
          path: blinkit-bot/data
          key: blinkit-deal-cache-${{ github.run_id }}
          restore-keys: |
            blinkit-deal-cache-

      - name: Run Hourly Deal Hunter (Linux)
        if: runner.os == 'Linux'
        working-directory: blinkit-bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BLINKIT_LAT: ${{ secrets.BLINKIT_LAT }}
          BLINKIT_LON: ${{ secrets.BLINKIT_LON }}
          BLINKIT_COOKIE: ${{ secrets.BLINKIT_COOKIE }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
          MIN_DISCOUNT: ${{ inputs.min_discount || secrets.MIN_DISCOUNT || '80' }}
          FORCE_SEND: ${{ inputs.force_send || 'false' }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: |
          echo "Starting Blinkit Deal Hunter Bot..."
          xvfb-run --auto-servernum --server-args="-screen 0 1280x960x24" node src/runner.js

      - name: Run Hourly Deal Hunter (Windows / macOS)
        if: runner.os != 'Linux'
        working-directory: blinkit-bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BLINKIT_LAT: ${{ secrets.BLINKIT_LAT }}
          BLINKIT_LON: ${{ secrets.BLINKIT_LON }}
          BLINKIT_COOKIE: ${{ secrets.BLINKIT_COOKIE }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
          MIN_DISCOUNT: ${{ inputs.min_discount || secrets.MIN_DISCOUNT || '80' }}
          FORCE_SEND: ${{ inputs.force_send || 'false' }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: |
          echo "Starting Blinkit Deal Hunter Bot on ${{ runner.os }}..."
          node src/runner.js

      - name: Save Deal Cache (Cloud only)
        if: always() && runner.os == 'Linux'
        uses: actions/cache/save@v4
        with:
          path: blinkit-bot/data
          key: blinkit-deal-cache-${{ github.run_id }}
